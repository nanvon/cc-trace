[package]
name = "cc-trace"
version = "0.1.18"
description = "Cross-platform Codex and Claude Code quota monitor"
authors = ["nanvon"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cc_trace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api 支撑紧凑面板的透明窗口与 popover 材质（tauri.conf.json 的
# macOSPrivateApi 与 windowEffects）。代价是不能上架 Mac App Store；CC Trace 走
# 独立分发，见 docs/桌面壳验证记录.md。
# `~2.11` 锁定小版本：macos_status_item 依赖 `with_inner_tray_icon`，tauri 官方
# 提示 tray-icon 可能在 minor 版本里更新，跨小版本升级需单独回归菜单栏行为。
tauri = { version = "~2.11", features = ["tray-icon", "macos-private-api"] }
# 常驻托盘应用必须单实例，否则二次启动会出现第二个图标与第二份设置写入。
tauri-plugin-single-instance = "2"
# 开机自动启动属首版必须能力，见 docs/产品范围.md「基础设置」。
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 契约里的时刻统一是 ISO 8601 UTC 字符串，退避与新鲜度计算需要真正的日历时间。
chrono = "0.4"
# 「跟随系统」的系统语言由 Rust 平台层解析，前端不读 navigator.language。
sys-locale = "0.3"
# 自动刷新循环与合成 Provider 的延迟；`sync` 提供 token 刷新的单飞互斥锁。
tokio = { version = "1", features = ["time", "sync"] }
# Provider 额度请求与 token 刷新。rustls 而非系统 OpenSSL，两个平台构建条件一致；
# 关掉默认 features 后必须补回代理探测：`macos-system-configuration`（macOS 读系统
# 代理）与 `system-proxy`（读环境变量代理）。否则国内网络下直连 chatgpt.com 会被
# DNS 污染挡死，而 cc-bar 走 URLSession 天然继承系统代理。
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "system-proxy",
  "macos-system-configuration",
] }
# 身份变化判断用的单向摘要。比较值不落盘：缓存只存摘要，展示身份（完整账号）
# 是唯一落盘的身份明文，见 docs/额度领域模型.md 第 4.1 节与 ADR-0025。
sha2 = "0.10"
# GB 级本地 JSONL 的派生索引留在 Rust 层；bundled 固定 SQLite 能力并避免目标机
# 系统库差异。前端不获得 SQL 权限，见 ADR-0018。
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Claude Code 的凭据可能只存在于系统钥匙串，见 ADR-0013。使用系统 API 读写，
# 不启动 `security` 子进程。
security-framework = "3"
# 菜单栏的「标识 + 百分比」徽标位图，见 ADR-0017。选 resvg 而不是自己用
# tiny-skia + ab_glyph 排版：它能直接渲染现成的 Provider 标识 SVG 并用系统字体
# 排文字，不需要自己处理字形布局。`tiny_skia` 与 `usvg` 由它 re-export。
resvg = "0.45"
# compact 面板「点击外部关闭」的全局监听，见 platform/outside_click.rs。
# 三个 crate 都已随 tauri 的 macos-private-api 进入依赖树，这里提升为直接依赖：
# AppKit 的 key window 语义要求未激活应用的窗口不会成为 key，「失焦关闭」因此
# 不可靠，改由 NSEvent 全局监听复刻 NSPopover 的 transient 行为。
objc2-app-kit = { version = "0.3", features = ["block2"] }
objc2-foundation = { version = "0.3", features = ["objc2-core-foundation"] }
# block2 与 objc2 由上面的 AppKit 绑定带来，直接依赖以便代码引用。
block2 = "0.6"
objc2 = "0.6"

[dev-dependencies]
tempfile = "3"
