[package]
name = "cc-trace"
version = "0.1.6"
description = "Cross-platform Codex and Claude Code quota monitor"
authors = ["nanvon"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cc_trace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api 支撑紧凑面板的透明窗口与 popover 材质（tauri.conf.json 的
# macOSPrivateApi 与 windowEffects）。代价是不能上架 Mac App Store；CC Trace 走
# 独立分发，见 docs/桌面壳验证记录.md。
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
# 常驻托盘应用必须单实例，否则二次启动会出现第二个图标与第二份设置写入。
tauri-plugin-single-instance = "2"
# 开机自动启动属首版必须能力，见 docs/产品范围.md「基础设置」。
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 契约里的时刻统一是 ISO 8601 UTC 字符串，退避与新鲜度计算需要真正的日历时间。
chrono = "0.4"
# 「跟随系统」的系统语言由 Rust 平台层解析，前端不读 navigator.language。
sys-locale = "0.3"
# 自动刷新循环与合成 Provider 的延迟；`sync` 提供 token 刷新的单飞互斥锁。
tokio = { version = "1", features = ["time", "sync"] }
# Provider 额度请求与 token 刷新。rustls 而非系统 OpenSSL，两个平台构建条件一致；
# 关掉默认 features 避免引入 cookie、代理自动探测等首版不需要的能力。
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
] }
# 身份变化判断用的单向摘要。account id 与邮箱本身永远不落盘，缓存里只存摘要，
# 见 docs/额度领域模型.md 第 4.1 节。
sha2 = "0.10"
# GB 级本地 JSONL 的派生索引留在 Rust 层；bundled 固定 SQLite 能力并避免目标机
# 系统库差异。前端不获得 SQL 权限，见 ADR-0018。
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Claude Code 的凭据可能只存在于系统钥匙串，见 ADR-0013。使用系统 API 读写，
# 不启动 `security` 子进程。
security-framework = "3"
# 菜单栏的「标识 + 百分比」徽标位图，见 ADR-0017。选 resvg 而不是自己用
# tiny-skia + ab_glyph 排版：它能直接渲染现成的 Provider 标识 SVG 并用系统字体
# 排文字，不需要自己处理字形布局。`tiny_skia` 与 `usvg` 由它 re-export。
resvg = "0.45"

[dev-dependencies]
tempfile = "3"
