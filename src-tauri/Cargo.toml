[package]
name = "cc-trace"
version = "0.1.0"
description = "Cross-platform Codex and Claude Code quota monitor"
authors = ["nanvon"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cc_trace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api 支撑紧凑面板的透明窗口与 popover 材质（tauri.conf.json 的
# macOSPrivateApi 与 windowEffects）。代价是不能上架 Mac App Store；CC Trace 走
# 独立分发，见 docs/桌面壳验证记录.md。
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
# 常驻托盘应用必须单实例，否则二次启动会出现第二个图标与第二份设置写入。
tauri-plugin-single-instance = "2"
# 开机自动启动属首版必须能力，见 docs/产品范围.md「基础设置」。
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 契约里的时刻统一是 ISO 8601 UTC 字符串，退避与新鲜度计算需要真正的日历时间。
chrono = "0.4"
# 「跟随系统」的系统语言由 Rust 平台层解析，前端不读 navigator.language。
sys-locale = "0.3"
# 自动刷新循环与合成 Provider 的延迟。
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tempfile = "3"
