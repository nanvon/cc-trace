# CC Trace CI 基线。
#
# 范围由 docs/工程与发布.md 第 3 节定义：只保证能编译、类型正确、格式与 lint 通过、
# 测试通过。明确不做：不打包、不签名、不公证、不创建 Release、不发起真实 Provider
# 请求、不依赖相邻的 ../cc-bar 仓库。
#
# Tray、窗口与多显示器需要真实桌面会话，属人工实机验证，见 docs/桌面壳验证记录.md。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check and build
        run: pnpm build

      - name: Test
        run: pnpm test

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-

      # Tauri 在 Linux 需要系统依赖；本矩阵只有 macOS 与 Windows，无需额外安装。
      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust lint
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
