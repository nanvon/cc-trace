<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>CC Trace · Tray Shell Prototype</title>
    <link
      rel="icon"
      href="../../design/brand/app-icons/tray-symbol.svg"
      type="image/svg+xml"
    />
    <link rel="stylesheet" href="./prototype.css" />
  </head>
  <body data-theme="light">
    <a class="skip-link" href="#prototype">跳到原型</a>

    <header class="lab-toolbar">
      <strong>CC Trace 交互原型</strong>
      <label>
        平台
        <select id="platform" name="platform" autocomplete="off">
          <option value="mac">macOS Menu Bar</option>
          <option value="windows">Windows Tray</option>
        </select>
      </label>
      <label>
        状态
        <select id="scenario" name="scenario" autocomplete="off">
          <option value="live">成功</option>
          <option value="loading">加载／刷新</option>
          <option value="noCredentials">无凭据</option>
          <option value="offlineStale">离线旧快照</option>
          <option value="rateLimited">刷新受限</option>
          <option value="error">单 Provider 错误</option>
        </select>
      </label>
      <label>
        外观
        <select id="theme" name="theme" autocomplete="off">
          <option value="light">浅色</option>
          <option value="dark">深色</option>
        </select>
      </label>
      <button id="showOnboarding" type="button">首次启动</button>
    </header>

    <main id="prototype" class="prototype" data-platform="mac" data-theme="light">
      <section class="desktop" aria-label="系统区域与紧凑面板原型">
        <div class="system-bar">
          <span id="systemLabel">macOS Menu Bar</span>
          <button
            id="trayButton"
            class="tray-button"
            type="button"
            aria-label="打开 CC Trace 紧凑额度面板"
            aria-expanded="true"
          >
            <img
              class="tray-mark"
              src="../../design/brand/app-icons/tray-symbol.svg"
              alt=""
              aria-hidden="true"
            />
          </button>
        </div>

        <aside id="compactPanel" class="compact-panel" aria-label="紧凑额度面板">
          <header class="compact-header">
            <div>
              <p class="utility-label">CC TRACE</p>
              <h1 id="overallTitle">额度状态正常</h1>
              <p id="overallMeta" class="supporting">刚刚刷新</p>
            </div>
            <button
              id="refreshButton"
              class="icon-button"
              type="button"
              aria-label="刷新全部额度"
            >
              ↻
            </button>
          </header>

          <div id="providerList" class="provider-list" aria-live="polite"></div>

          <footer class="compact-actions">
            <button id="openMain" class="primary-button" type="button">
              查看详情
            </button>
            <button id="openSettings" class="quiet-button" type="button">
              设置
            </button>
            <button id="quitPrototype" class="quiet-button" type="button">
              退出
            </button>
          </footer>
        </aside>

        <nav id="trayMenu" class="tray-menu" aria-label="Windows Tray 菜单" hidden>
          <button id="menuOpenMain" type="button">打开 CC Trace</button>
          <button id="menuRefresh" type="button">刷新额度</button>
          <button id="menuOpenSettings" type="button">设置</button>
          <button id="menuQuit" type="button">退出 CC Trace</button>
        </nav>
      </section>
    </main>

    <dialog id="mainWindow">
      <article class="window-shell" aria-labelledby="mainTitle">
        <header class="window-header">
          <div>
            <p class="utility-label">额度详情</p>
            <h2 id="mainTitle">CC Trace</h2>
          </div>
          <div class="window-actions">
            <button id="mainRefresh" class="quiet-button" type="button">
              刷新全部
            </button>
            <button class="icon-button" data-close="mainWindow" type="button" aria-label="关闭主窗口">
              ×
            </button>
          </div>
        </header>
        <div id="mainProviders" class="main-providers"></div>
        <section class="explanation" aria-labelledby="explanationTitle">
          <h3 id="explanationTitle">数据是否可信</h3>
          <p id="explanationCopy">
            当前数据来自本次成功刷新，可以用于判断额度风险。
          </p>
        </section>
      </article>
    </dialog>

    <dialog id="settingsWindow">
      <form class="window-shell settings-form" method="dialog" aria-labelledby="settingsTitle">
        <header class="window-header">
          <div>
            <p class="utility-label">独立窗口</p>
            <h2 id="settingsTitle">设置</h2>
          </div>
          <button class="icon-button" value="cancel" aria-label="关闭设置窗口">×</button>
        </header>
        <fieldset>
          <legend>通用</legend>
          <label>
            自动刷新间隔
            <select name="refreshInterval" autocomplete="off">
              <option>15 分钟</option>
              <option>30 分钟</option>
              <option>60 分钟</option>
            </select>
          </label>
          <label class="check-row">
            <input type="checkbox" name="launchAtLogin" />
            开机时启动 CC Trace
          </label>
        </fieldset>
        <fieldset>
          <legend>外观与语言</legend>
          <label>
            语言
            <select name="language" autocomplete="off">
              <option>跟随系统</option>
              <option>中文</option>
              <option>English</option>
            </select>
          </label>
          <label>
            外观
            <select name="appearance" autocomplete="off">
              <option>跟随系统</option>
              <option>浅色</option>
              <option>深色</option>
            </select>
          </label>
        </fieldset>
        <p class="about-copy">CC Trace 0.1.0 · 不读取或迁移 cc-bar 应用数据</p>
      </form>
    </dialog>

    <dialog id="onboardingWindow">
      <article class="window-shell onboarding" aria-labelledby="onboardingTitle">
        <div class="brand-mark" aria-hidden="true">
          <img src="../../design/brand/cc-trace-symbol.svg" alt="" />
        </div>
        <p class="utility-label">首次启动</p>
        <h2 id="onboardingTitle">先确认本机状态</h2>
        <p>
          CC Trace 只在 Rust 层按最小范围发现 Codex 与 Claude Code
          凭据，不迁移旧应用数据，也不会在界面中显示凭据原文。
        </p>
        <ul class="check-list">
          <li><span aria-hidden="true">✓</span> Codex：发现可用凭据</li>
          <li><span aria-hidden="true">—</span> Claude Code：尚未发现凭据</li>
        </ul>
        <div class="onboarding-actions">
          <button class="quiet-button" data-close="onboardingWindow" type="button">
            稍后处理
          </button>
          <button
            id="finishOnboarding"
            class="primary-button"
            data-close="onboardingWindow"
            type="button"
          >
            开始使用
          </button>
        </div>
      </article>
    </dialog>

    <script src="./prototype.js"></script>
  </body>
</html>
